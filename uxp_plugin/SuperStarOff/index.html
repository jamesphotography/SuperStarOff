<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>慧眼去星 SuperStarOff</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--uxp-host-background-color);
            color: var(--uxp-host-text-color);
            padding: 16px;
            font-size: 13px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--uxp-host-border-color);
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 11px;
            opacity: 0.7;
        }

        .section {
            background: var(--uxp-host-background-color-secondary);
            border: 1px solid var(--uxp-host-border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::before {
            content: "●";
            color: var(--uxp-host-link-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 6px;
            opacity: 0.9;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 6px 8px;
            background: var(--uxp-host-background-color);
            color: var(--uxp-host-text-color);
            border: 1px solid var(--uxp-host-border-color);
            border-radius: 4px;
            font-size: 12px;
        }

        select:focus {
            outline: 2px solid var(--uxp-host-link-color);
            outline-offset: -1px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-value {
            min-width: 40px;
            text-align: right;
            font-size: 12px;
            font-weight: 600;
            color: var(--uxp-host-link-color);
        }

        input[type="range"] {
            flex: 1;
        }

        .info-box {
            background: var(--uxp-host-background-color-tertiary);
            border: 1px solid var(--uxp-host-border-color);
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 11px;
            line-height: 1.4;
            opacity: 0.85;
        }

        .info-box::before {
            content: "ℹ️ ";
            margin-right: 4px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        button {
            width: 100%;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--uxp-host-link-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--uxp-host-background-color-secondary);
            color: var(--uxp-host-text-color);
            border: 1px solid var(--uxp-host-border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--uxp-host-background-color-tertiary);
        }

        .progress-container {
            display: none;
            margin-top: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--uxp-host-background-color-secondary);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--uxp-host-link-color);
            width: 0%;
            transition: width 0.3s;
            animation: progress-pulse 1.5s ease-in-out infinite;
        }

        @keyframes progress-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .progress-text {
            font-size: 11px;
            text-align: center;
            margin-top: 6px;
            opacity: 0.8;
        }

        .status {
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }

        .status.success {
            background: rgba(0, 200, 100, 0.15);
            color: rgb(0, 200, 100);
            border: 1px solid rgba(0, 200, 100, 0.3);
        }

        .status.error {
            background: rgba(255, 70, 70, 0.15);
            color: rgb(255, 100, 100);
            border: 1px solid rgba(255, 70, 70, 0.3);
        }

        .footer {
            text-align: center;
            font-size: 10px;
            opacity: 0.5;
            padding-top: 12px;
            border-top: 1px solid var(--uxp-host-border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>慧眼去星 SuperStarOff</h1>
            <p>AI驱动的星点去除工具</p>
        </div>

        <div class="section">
            <div class="section-title">处理参数</div>

            <div class="form-group">
                <label for="stride">处理步长（质量 vs 速度）</label>
                <select id="stride">
                    <option value="128">128 - 最高质量（最慢）</option>
                    <option value="256" selected>256 - 平衡（推荐）</option>
                    <option value="384">384 - 较快</option>
                    <option value="512">512 - 最快（质量稍低）</option>
                </select>
            </div>

            <div class="form-group">
                <label for="device">计算设备</label>
                <select id="device">
                    <option value="auto" selected>自动选择（推荐）</option>
                    <option value="mps">Apple Silicon GPU (MPS)</option>
                    <option value="cpu">仅CPU</option>
                </select>
            </div>

            <div class="info-box">
                步长越小质量越高但速度越慢。一般4K图片用步长256约需1-2分钟。
            </div>
        </div>

        <div class="section">
            <div class="section-title">图层设置</div>

            <div class="form-group">
                <label for="layerName">新图层名称</label>
                <select id="layerName">
                    <option value="auto" selected>自动命名（原名_starless）</option>
                    <option value="custom">自定义...</option>
                </select>
            </div>

            <div class="form-group" id="customNameGroup" style="display: none;">
                <input type="text" id="customName" placeholder="输入图层名称"
                       style="width: 100%; padding: 6px 8px; border: 1px solid var(--uxp-host-border-color); border-radius: 4px;">
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="processBtn">
                🌟 开始去除星点
            </button>
            <button class="btn-secondary" id="cancelBtn" style="display: none;">
                ⏹ 取消处理
            </button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">正在处理...</div>
        </div>

        <div class="status" id="status"></div>

        <div class="footer">
            慧眼去星 v1.0 | Powered by PyTorch & Apple Silicon
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>

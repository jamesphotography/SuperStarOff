name: Build Windows Release

# 触发方式：
#   1. 推送 v*.*.* tag → 构建并创建 draft release（需人工确认后发布）
#   2. 手动触发（workflow_dispatch）→ 只构建并上传 artifact，不建 release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.3，不带 v 前缀）'
        required: true

env:
  # AI 模型托管在独立的 prerelease 中，不随仓库 checkout 拉取。
  # 模型走 Git LFS 时每次构建要消耗 176MB 带宽，免费额度一个月只够五六次。
  MODEL_RELEASE_TAG: model-assets-2025
  MODEL_FILE: SuperStarOff2025.pt

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # 不拉 LFS：模型改从 release 下载，其余 LFS 对象构建用不到
          lfs: false

      - name: 解析版本号
        id: meta
        shell: bash
        # 输入经 env 传入而非直接内插，并强制校验格式：
        # 版本号后续会拼进 ISCC 命令行，未经校验的值等同于命令注入面。
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式非法: '$VERSION'（应形如 1.1.3）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VERSION"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 下载 AI 模型
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$MODEL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$MODEL_FILE" \
            --output "models/$MODEL_FILE" \
            --clobber
          ls -lh "models/$MODEL_FILE"

      - name: 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # 显式安装 CPU 版 torch：PyPI 默认 wheel 可能携带 CUDA，体积翻数倍，
          # 而本项目 Windows 端只用 CPU 推理。
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller superstaroff_windows.spec --noconfirm

      - name: 准备安装包附带文件
        # 对应 installer/build_windows.bat 的 Step 2。
        # 不直接调用该 .bat：它内含多处 pause，在 CI 中会永久阻塞。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\superstaroff\scripts | Out-Null
          Copy-Item "src\慧眼去星.jsx" dist\superstaroff\scripts\ -Force
          Copy-Item installer\install_to_photoshop.bat dist\superstaroff\scripts\ -Force
          Copy-Item installer\uninstall_from_photoshop.bat dist\superstaroff\scripts\ -Force
          Get-ChildItem dist\superstaroff\scripts

      # macOS 侧曾出现签名公证全过、产物却因缺 torch.distributed 子模块
      # 无法启动的情况。装包前先实跑一次，避免发出装上就崩的安装包。
      - name: 冒烟测试（确认产物真能加载模型并推理）
        shell: bash
        # CLI 输出中文，Windows 控制台默认 cp1252 会抛 UnicodeEncodeError。
        # 生产环境由 JSX 生成的 bat 用 chcp 65001 解决，此处等效设置。
        env:
          PYTHONIOENCODING: utf-8

        run: |
          set -euo pipefail
          ./dist/superstaroff/superstaroff.exe test_input.tif "$RUNNER_TEMP/smoke_out.tif" --verbose
          test -s "$RUNNER_TEMP/smoke_out.tif"
          echo "[OK] 推理链路正常"

      - name: 编译 Inno Setup 安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer/SuperStarOff.iss
          options: /DMyAppVersion=${{ steps.meta.outputs.version }}

      - name: 上传安装包为 workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SuperStarOff-Windows-v${{ steps.meta.outputs.version }}
          path: installer_output/SuperStarOff-Installer-v*.exe
          retention-days: 30
          if-no-files-found: error

      # 仅 tag 推送时建 release，且建成 draft：
      # 上传完成后由维护者核对产物、补充 macOS 包，再手动点击发布。
      - name: 创建 GitHub Release（draft）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 慧眼去星 ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            installer_output/SuperStarOff-Installer-v*.exe

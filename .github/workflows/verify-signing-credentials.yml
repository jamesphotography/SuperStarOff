name: Verify Signing Credentials

# 只验证签名与公证凭据是否可用，不构建、不提交公证请求、不产生任何产物。
# 证书更换或到期后可随时手动跑一次复查。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: 物化两张证书
        env:
          APP_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CERT" ] || [ -z "$INSTALLER_CERT" ]; then
            echo "::error::证书 Secret 为空"
            exit 1
          fi
          printf '%s' "$APP_CERT" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_CERT" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          echo "Application 证书: $(wc -c < "$RUNNER_TEMP/app.p12") 字节"
          echo "Installer 证书:   $(wc -c < "$RUNNER_TEMP/installer.p12") 字节"

      - name: 验证 Application 证书与密码
        env:
          PW: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          # -nokeys 只输出证书部分，私钥不会进日志
          if ! openssl pkcs12 -in "$RUNNER_TEMP/app.p12" -nokeys -passin env:PW \
               -legacy 2>/dev/null | openssl x509 -noout -subject -enddate; then
            openssl pkcs12 -in "$RUNNER_TEMP/app.p12" -nokeys -passin env:PW 2>/dev/null \
              | openssl x509 -noout -subject -enddate
          fi

      - name: 验证 Installer 证书与密码
        env:
          PW: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          if ! openssl pkcs12 -in "$RUNNER_TEMP/installer.p12" -nokeys -passin env:PW \
               -legacy 2>/dev/null | openssl x509 -noout -subject -enddate; then
            openssl pkcs12 -in "$RUNNER_TEMP/installer.p12" -nokeys -passin env:PW 2>/dev/null \
              | openssl x509 -noout -subject -enddate
          fi

      - name: 验证证书可导入钥匙串（实际签名路径）
        env:
          APP_PW: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          INSTALLER_PW: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/verify.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 900 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$APP_PW" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_PW" -T /usr/bin/productsign
          security list-keychain -d user -s "$KC"
          echo "--- 钥匙串中可用的签名身份 ---"
          security find-identity -v "$KC"

      - name: 验证公证凭据
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "Team ID: $TEAM_ID"
          # history 只读取历史记录，不提交任何内容；凭据错误会在此失败
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PW" \
            --team-id "$TEAM_ID" 2>&1 | head -20

      - name: 清理
        if: always()
        run: rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
